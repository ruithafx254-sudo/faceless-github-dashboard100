<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Premium Portfolio Dashboard</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap');
        
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #050505; 
            color: #ffffff; 
            -webkit-tap-highlight-color: transparent; 
        }
        
        .tabular-nums { font-family: 'JetBrains Mono', monospace; }
        
        /* Glassmorphism & Animations */
        .glass-panel {
            background: rgba(24, 24, 27, 0.6);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        
        .accent-glow {
            box-shadow: 0 0 20px rgba(16, 185, 129, 0.15);
        }

        .fade-in { animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #27272a; border-radius: 10px; }
    </style>
</head>
<body class="pb-24 antialiased min-h-screen flex flex-col">

    <!-- Header Navigation -->
    <header class="px-6 pt-8 pb-4 flex justify-between items-center sticky top-0 z-50 glass-panel">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-zinc-900 flex items-center justify-center border border-zinc-800 transition hover:bg-zinc-800 cursor-pointer">
                <i class="fa-solid fa-qrcode text-zinc-300"></i>
            </div>
        </div>
        <div class="flex items-center space-x-2 bg-zinc-900/80 px-5 py-2 rounded-full border border-zinc-800 cursor-pointer hover:border-zinc-700 transition">
            <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
            <span class="text-sm font-semibold tracking-wide">Vault 01</span>
            <i class="fa-solid fa-chevron-down text-xs text-zinc-500 ml-1"></i>
        </div>
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full bg-zinc-900 flex items-center justify-center border border-zinc-800 transition hover:bg-zinc-800 cursor-pointer">
                <i class="fa-solid fa-bell text-zinc-300"></i>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-2xl mx-auto w-full">
        <!-- Main Balance -->
        <div class="mt-8 text-center px-6">
            <p class="text-sm text-zinc-400 font-medium tracking-widest uppercase mb-2">Total Balance</p>
            <h1 id="main-balance" class="text-5xl md:text-6xl font-bold tracking-tight tabular-nums text-transparent bg-clip-text bg-gradient-to-r from-white to-zinc-400">
                $0.00
            </h1>
            <div class="mt-3 flex items-center justify-center space-x-2">
                <span id="24h-change" class="text-sm font-bold text-emerald-400 bg-emerald-400/10 px-2.5 py-1 rounded-lg">
                    <i class="fa-solid fa-arrow-up text-xs mr-1"></i> Live Market Sync
                </span>
            </div>
        </div>

        <!-- Action Buttons -->
        <div class="flex justify-center space-x-6 mt-10 px-6">
            <button class="group flex flex-col items-center gap-3">
                <div class="w-14 h-14 bg-emerald-500 text-black rounded-full flex items-center justify-center text-xl shadow-lg shadow-emerald-500/20 group-hover:scale-105 transition-transform">
                    <i class="fa-solid fa-arrow-up-right"></i>
                </div>
                <span class="text-sm font-semibold text-zinc-300">Send</span>
            </button>
            <button class="group flex flex-col items-center gap-3">
                <div class="w-14 h-14 bg-zinc-900 text-white rounded-full flex items-center justify-center text-xl border border-zinc-800 group-hover:bg-zinc-800 group-hover:scale-105 transition-all">
                    <i class="fa-solid fa-arrow-down-left"></i>
                </div>
                <span class="text-sm font-semibold text-zinc-300">Receive</span>
            </button>
            <button class="group flex flex-col items-center gap-3">
                <div class="w-14 h-14 bg-zinc-900 text-white rounded-full flex items-center justify-center text-xl border border-zinc-800 group-hover:bg-zinc-800 group-hover:scale-105 transition-all">
                    <i class="fa-solid fa-credit-card"></i>
                </div>
                <span class="text-sm font-semibold text-zinc-300">Buy</span>
            </button>
            <button class="group flex flex-col items-center gap-3">
                <div class="w-14 h-14 bg-zinc-900 text-white rounded-full flex items-center justify-center text-xl border border-zinc-800 group-hover:bg-zinc-800 group-hover:scale-105 transition-all">
                    <i class="fa-solid fa-right-left"></i>
                </div>
                <span class="text-sm font-semibold text-zinc-300">Swap</span>
            </button>
        </div>

        <!-- Assets List -->
        <div class="px-6 mt-12">
            <div class="flex justify-between items-end mb-6">
                <h3 class="text-xl font-bold">Assets</h3>
                <i class="fa-solid fa-sliders text-zinc-500 cursor-pointer hover:text-white transition"></i>
            </div>
            
            <div id="asset-container" class="space-y-4">
                <!-- Assets injected by JS -->
                <div class="text-center py-10 text-zinc-500 animate-pulse">
                    Connecting to live network...
                </div>
            </div>
        </div>
    </main>

    <!-- Bottom Navigation -->
    <nav class="fixed bottom-0 left-0 right-0 h-20 glass-panel flex justify-around items-center px-6 z-50 rounded-t-3xl max-w-2xl mx-auto">
        <div class="flex flex-col items-center text-white cursor-pointer">
            <i class="fa-solid fa-wallet text-xl mb-1"></i>
            <span class="text-[10px] font-bold tracking-wider">Wallet</span>
        </div>
        <div class="flex flex-col items-center text-zinc-600 hover:text-zinc-300 transition cursor-pointer">
            <i class="fa-solid fa-chart-pie text-xl mb-1"></i>
            <span class="text-[10px] font-bold tracking-wider">Market</span>
        </div>
        <div class="flex flex-col items-center text-zinc-600 hover:text-zinc-300 transition cursor-pointer">
            <i class="fa-solid fa-compass text-xl mb-1"></i>
            <span class="text-[10px] font-bold tracking-wider">Browser</span>
        </div>
        <div class="flex flex-col items-center text-zinc-600 hover:text-zinc-300 transition cursor-pointer">
            <i class="fa-solid fa-gear text-xl mb-1"></i>
            <span class="text-[10px] font-bold tracking-wider">Settings</span>
        </div>
    </nav>

    <script>
        /**
         * State Configuration
         * Edit these values to adjust the holdings. The math will automatically
         * compute based on the live API prices.
         */
        const userWallet = {
            bitcoin: { amount: 14.52, symbol: 'BTC', icon: 'fa-bitcoin', color: 'text-orange-500', bg: 'bg-orange-500/10' },
            ethereum: { amount: 245.80, symbol: 'ETH', icon: 'fa-ethereum', color: 'text-indigo-400', bg: 'bg-indigo-400/10' },
            solana: { amount: 8500.00, symbol: 'SOL', icon: 'fa-bolt', color: 'text-purple-400', bg: 'bg-purple-400/10' },
            tether: { amount: 150000.00, symbol: 'USDT', icon: 'fa-dollar-sign', color: 'text-emerald-500', bg: 'bg-emerald-500/10' }
        };

        let livePrices = {};

        // Fetch live market data from CoinGecko
        async function fetchMarketData() {
            try {
                const ids = Object.keys(userWallet).join(',');
                const response = await fetch(`https://api.coingecko.com/api/v3/simple/price?ids=${ids}&vs_currencies=usd&include_24hr_change=true`);
                
                if (!response.ok) throw new Error("API Limit or Network Error");
                
                livePrices = await response.json();
                renderDashboard();
            } catch (error) {
                console.warn("Using fallback prices due to API issue:", error);
                // Fallback static prices if API is rate-limited
                livePrices = {
                    bitcoin: { usd: 65000, usd_24h_change: 2.5 },
                    ethereum: { usd: 3500, usd_24h_change: 1.2 },
                    solana: { usd: 145, usd_24h_change: 5.4 },
                    tether: { usd: 1.00, usd_24h_change: 0.01 }
                };
                renderDashboard();
            }
        }

        // Animate balance counting up
        function animateBalance(targetValue) {
            const el = document.getElementById('main-balance');
            const duration = 1500;
            const startValue = 0;
            const startTime = performance.now();

            function update(currentTime) {
                const elapsed = currentTime - startTime;
                const progress = Math.min(elapsed / duration, 1);
                
                // Ease out quad
                const easeOut = progress * (2 - progress);
                const current = startValue + (targetValue - startValue) * easeOut;
                
                el.innerText = `$${current.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;

                if (progress < 1) {
                    requestAnimationFrame(update);
                } else {
                    el.innerText = `$${targetValue.toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2})}`;
                }
            }
            requestAnimationFrame(update);
        }

        function renderDashboard() {
            const container = document.getElementById('asset-container');
            container.innerHTML = '';
            
            let totalPortfolioValue = 0;
            let delay = 0;

            for (const [id, data] of Object.entries(userWallet)) {
                const priceData = livePrices[id] || { usd: 0, usd_24h_change: 0 };
                const currentPrice = priceData.usd;
                const change24h = priceData.usd_24h_change;
                const assetTotal = currentPrice * data.amount;
                
                totalPortfolioValue += assetTotal;

                const isPositive = change24h >= 0;
                const changeColor = isPositive ? 'text-emerald-400' : 'text-red-400';
                const changeIcon = isPositive ? 'fa-arrow-up' : 'fa-arrow-down';

                const html = `
                    <div class="glass-panel rounded-2xl p-4 flex justify-between items-center fade-in hover:bg-zinc-800/40 transition cursor-pointer" style="animation-delay: ${delay}ms">
                        <div class="flex items-center space-x-4">
                            <div class="w-12 h-12 rounded-full ${data.bg} ${data.color} flex items-center justify-center text-xl border border-zinc-800">
                                <i class="fa-brands ${data.icon}"></i>
                            </div>
                            <div>
                                <h4 class="font-bold text-lg leading-tight uppercase">${data.symbol}</h4>
                                <div class="flex items-center space-x-2 mt-1">
                                    <span class="text-sm text-zinc-400">$${currentPrice.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</span>
                                    <span class="text-xs font-semibold ${changeColor}">
                                        <i class="fa-solid ${changeIcon} text-[10px]"></i> ${Math.abs(change24h).toFixed(2)}%
                                    </span>
                                </div>
                            </div>
                        </div>
                        <div class="text-right">
                            <p class="font-bold text-lg tabular-nums leading-tight">$${assetTotal.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 2})}</p>
                            <p class="text-sm text-zinc-400 tabular-nums mt-1">${data.amount.toLocaleString(undefined, {minimumFractionDigits: 2, maximumFractionDigits: 6})} ${data.symbol}</p>
                        </div>
                    </div>
                `;
                container.insertAdjacentHTML('beforeend', html);
                delay += 100; // Stagger animation
            }

            animateBalance(totalPortfolioValue);
        }

        // Initialize application
        window.addEventListener('DOMContentLoaded', () => {
            fetchMarketData();
            // Refresh data every 60 seconds
            setInterval(fetchMarketData, 60000);
        });
    </script>
</body>
</html>
